# GEL reusable workflow. A repo calls it with a 10-line caller, see templates/caller.yml.
name: GEL

on:
  workflow_call:
    inputs:
      gel_ref:
        description: Tag of flisk-sh/gel to run. The caller pins this to a version.
        type: string
        default: v1

permissions:
  contents: read

jobs:
  gel:
    name: GEL guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flisk-sh/gel
          ref: ${{ inputs.gel_ref }}
          path: .gel-engine
      - name: Build pull request context
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .gel-engine/bin/gel-ctx.mjs "$RUNNER_TEMP/gel-ctx.json"
      # opt-in: docs/gel.json "verify" (install, build, test, revert check) and "perf_budget" (a named benchmark). These run the
      # project's own commands on the pull request checkout, so the caller must trigger on pull_request, never pull_request_target.
      # The project's toolchain (node, bun, python) must already be on the runner; put setup in verify.install.
      - name: Build, test and measure the change
        if: github.event_name == 'pull_request' && hashFiles('docs/gel.json') != ''
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # only a repo that declared verify or perf_budget runs commands; an older engine without these commands is left alone
          if grep -qE '"(verify|perf_budget)"' docs/gel.json; then
            node .gel-engine/bin/gel.mjs verify --base "$BASE_SHA" --ctx "$RUNNER_TEMP/gel-ctx.json"
            node .gel-engine/bin/gel.mjs perf --ctx "$RUNNER_TEMP/gel-ctx.json"
          fi
      - name: Run guards
        env:
          # a pull request checks its diff; a push to the default branch scans the whole tree, so the record
          # (and Cilytics, which reads it) says whether main is clean, not only whether the last push was
          BASE_SHA: ${{ github.event.pull_request.base.sha || (github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && github.event.before || '') }}
        run: node .gel-engine/bin/gel.mjs run --base "$BASE_SHA" --ctx "$RUNNER_TEMP/gel-ctx.json" --record "$RUNNER_TEMP/gel-record.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gel-record
          path: ${{ runner.temp }}/gel-record.jsonl
          if-no-files-found: ignore
          retention-days: 30
